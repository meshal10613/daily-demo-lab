name: Daily Autonomous Demo Agent

on:
  schedule:
    - cron: "0 4 * * *" # Runs daily at 04:00 UTC (10:00 AM Asia/Dhaka)
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # Allows pushing new demos to main

concurrency:
  group: daily-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Generate and Validate Daily Demo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_daily_demo.py

      - name: Commit and push new demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit (demo already generated or up to date)."
          else
            COMMIT_TITLE="feat: add $(cat .current_demo_info 2>/dev/null || echo 'daily demo') [automated]"
            git commit -m "$COMMIT_TITLE"
            git push origin main
          fi
